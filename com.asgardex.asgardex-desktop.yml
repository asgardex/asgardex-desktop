id: com.asgardex.asgardex-desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
build-options:
  append-path: /usr/lib/sdk/node20/bin
command: asgardex
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: asgardex
    buildsystem: simple
    build-commands:
      - yarn install --immutable
      - yarn build
      - mkdir -p /app/bin
      - install -Dm755 ./dist/main/linux-unpacked/asgardex /app/bin/asgardex
      - /app/electron/patch-desktop-filename /app/bin/asgardex/resources/app.asar
    sources:
      - type: git
        url: https://github.com/asgardex/asgardex-desktop
        branch: develop
