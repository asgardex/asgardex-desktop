name: Electron build - Linux

permissions:
  contents: write

on:
  push:
    branches:
      # https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#onpushpull_requestbranchestags
      - 'release/**'
      - 'hotfix/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install missing dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Install Flatpak tooling
        run: |
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.electronjs.Electron2.BaseApp//24.08

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish Linux binaries
        run: yarn package:ci
        env:
          NODE_OPTIONS: --max-old-space-size=7168
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          VITE_NODE_ENV: production
          VITE_BLOCKCYPHER_API_KEY: ${{ secrets.REACT_APP_BLOCKCYPHER_API_KEY }}
          VITE_ETHERSCAN_API_KEY: ${{ secrets.REACT_APP_ETHERSCAN_API_KEY }}
          VITE_ASGARDEX_THORNAME: ${{ secrets.REACT_APP_ASGARDEX_THORNAME }}
          VITE_SOL_API_KEY: ${{ secrets.REACT_APP_SOL_API_KEY }}
          VITE_ADA_API_KEY: ${{ secrets.REACT_APP_ADA_API_KEY }}
          VITE_NOWNODES_API_KEY: ${{ secrets.REACT_APP_NOWNODES_API_KEY }}
          VITE_ASGARDEX_BROKER_URL: ${{secrets.VITE_ASGARDEX_BROKER_URL}}
          VITE_ASGARDEX_AFFILIATE_BROKERS_ADDRESS: ${{secrets.VITE_ASGARDEX_AFFILIATE_BROKERS_ADDRESS}}
          VITE_ASGARDEX_ONECLICK_AFFILIATES: ${{ secrets.VITE_ASGARDEX_ONECLICK_AFFILIATES }}
          VITE_ASGARDEX_ONECLICK_API_KEY: ${{ secrets.VITE_ASGARDEX_ONECLICK_API_KEY }}
          VITE_ASGARDEX_THORNODE_API: ${{ secrets.VITE_ASGARDEX_THORNODE_API }}
          VITE_ASGARDEX_THORNODE_RPC: ${{ secrets.VITE_ASGARDEX_THORNODE_RPC }}
          VITE_LIQUIFY_THORCHAIN_API_KEY: ${{ secrets.VITE_LIQUIFY_THORCHAIN_API_KEY }}
          VITE_LIQUIFY_THORCHAIN_RPC_KEY: ${{ secrets.VITE_LIQUIFY_THORCHAIN_RPC_KEY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ runner.OS }}
          path: release

      - name: List artifacts
        run: ls ./release
