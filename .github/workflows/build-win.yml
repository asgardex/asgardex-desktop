name: Electron build - Windows

permissions:
  contents: write

on:
  push:
    branches:
      # https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#onpushpull_requestbranchestags
      - 'release/**'
      - 'hotfix/**'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]

    steps:
      - name: Checkout git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      # Python 3.12+ removed distutils, but node-gyp needs it for native modules
      - name: Setup Python for node-gyp
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install --immutable --network-timeout 1000000

      - name: Publish Windows
        run: yarn package:ci
        env:
          NODE_OPTIONS: --max-old-space-size=7168
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          VITE_NODE_ENV: production
          VITE_BLOCKCYPHER_API_KEY: ${{ secrets.REACT_APP_BLOCKCYPHER_API_KEY }}
          VITE_ETHERSCAN_API_KEY: ${{ secrets.REACT_APP_ETHERSCAN_API_KEY }}
          VITE_ASGARDEX_THORNAME: ${{ secrets.REACT_APP_ASGARDEX_THORNAME }}
          VITE_SOL_API_KEY: ${{ secrets.REACT_APP_SOL_API_KEY }}
          VITE_ADA_API_KEY: ${{ secrets.REACT_APP_ADA_API_KEY }}
          VITE_NOWNODES_API_KEY: ${{ secrets.REACT_APP_NOWNODES_API_KEY }}
          VITE_ASGARDEX_BROKER_URL: ${{secrets.VITE_ASGARDEX_BROKER_URL}}
          VITE_ASGARDEX_AFFILIATE_BROKERS_ADDRESS: ${{secrets.VITE_ASGARDEX_AFFILIATE_BROKERS_ADDRESS}}
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ runner.OS }}
          path: release

      - name: List artifacts
        run: ls ./release
