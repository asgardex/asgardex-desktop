compressionLevel: mixed

enableGlobalCache: false

# Yarn 4.17 defaults enableScripts to false; keep it true so native modules
# (usb/hid for Ledger, utf-8-validate, …) still build their bindings on install.
enableScripts: true

nodeLinker: node-modules

# Wait 7 days before installing newly published package versions, to avoid
# pulling in freshly compromised or unstable releases (supply-chain hardening).
npmMinimalAgeGate: 7d

# Trusted org packages may be installed before the age gate elapses (e.g. intentional
# same-day @xchainjs releases we are integrating). Patterns match package names only.
npmPreapprovedPackages:
  - '@xchainjs/*'

yarnPath: .yarn/releases/yarn-4.17.0.cjs
